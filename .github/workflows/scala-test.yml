name: Test Scala Setup
on:
  push:
    paths: ["scala/**", ".github/workflows/scala-test.yml"]
  pull_request:
    paths: ["scala/**", ".github/workflows/scala-test.yml"]
  workflow_dispatch:
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: sbt/setup-sbt@v1
      - run: sbt run
        working-directory: scala
