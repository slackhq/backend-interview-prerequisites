name: Test Groovy Setup
on:
  push:
    paths: ["groovy/**", ".github/workflows/groovy-test.yml"]
  pull_request:
    paths: ["groovy/**", ".github/workflows/groovy-test.yml"]
  workflow_dispatch:
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - run: ./gradlew run --no-daemon
        shell: bash
        working-directory: groovy
