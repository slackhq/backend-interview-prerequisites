name: Test C Setup
on:
  push:
    paths: ["c/**", ".github/workflows/c-test.yml"]
  pull_request:
    paths: ["c/**", ".github/workflows/c-test.yml"]
  workflow_dispatch:
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev libjson-c-dev
      - if: runner.os == 'macOS'
        run: brew install pkg-config sqlite json-c
      - run: make setup
        working-directory: c
