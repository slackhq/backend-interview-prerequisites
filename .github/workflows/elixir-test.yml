name: Test Elixir Setup
on:
  push:
    paths: ["elixir/**", ".github/workflows/elixir-test.yml"]
  pull_request:
    paths: ["elixir/**", ".github/workflows/elixir-test.yml"]
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.2"
      - run: mix deps.get && mix run setup.exs
        working-directory: elixir
